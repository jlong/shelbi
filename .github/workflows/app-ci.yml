name: app-ci

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'scripts/ci/**'
      - '.github/workflows/app-ci.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'scripts/ci/**'
      - '.github/workflows/app-ci.yml'

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the declared MSRV toolchain
        uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: Check the workspace on the declared MSRV
        run: cargo check --workspace --locked --all-targets

  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Configure git identity
        run: |
          git config --global user.email "ci@shelbi.local"
          git config --global user.name "shelbi CI"

      - name: Build
        run: cargo build --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # One retry guards against residual timing flakiness under CI load
      # (several test binaries hammer the machine at once). A genuinely broken
      # test fails both attempts and still reddens the job; a retried flake is
      # surfaced as a warning so it stays visible rather than silently masked.
      # Safe to drop once the suite has proven stable across many runs.
      #
      # Each attempt runs under a hard `timeout`: a wedged test (a detached
      # session that never detaches, a shell capture that never returns) must
      # fail the step fast, never hang the runner for the job's full length.
      - name: Test
        run: |
          for attempt in 1 2; do
            echo "::group::cargo test --workspace (attempt $attempt)"
            timeout --signal=KILL 600 cargo test --workspace
            rc=$?
            echo "::endgroup::"
            if [ "$rc" = 0 ]; then
              exit 0
            fi
            if [ "$rc" = 137 ]; then
              echo "::warning::cargo test --workspace hit the 600s timeout on attempt $attempt (hang)"
            else
              echo "::warning::cargo test --workspace failed on attempt $attempt (exit $rc)"
            fi
          done
          echo "::error::cargo test --workspace did not pass after 2 attempts"
          exit 1

  # Nesting smoke: the single-process TUI is an ordinary full-screen program, so
  # it must launch, render, and tear down cleanly inside tmux and inside GNU
  # Screen (the `$TMUX` branching that used to special-case this is gone). The
  # script hard-asserts the binary paints a non-empty frame within ~2s and exits
  # 0 on the quit key, and reaps everything under bounded waits so the job can
  # never hang; see scripts/ci/tui-smoke.sh.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install tmux and screen
        run: sudo apt-get update && sudo apt-get install -y tmux screen

      - name: Build shelbi
        run: cargo build -p shelbi

      - name: Smoke the TUI inside tmux
        run: SHELBI_BIN="$PWD/target/debug/shelbi" scripts/ci/tui-smoke.sh tmux

      - name: Smoke the TUI inside GNU Screen
        run: SHELBI_BIN="$PWD/target/debug/shelbi" scripts/ci/tui-smoke.sh screen
