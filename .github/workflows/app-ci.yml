name: app-ci

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - '.github/workflows/app-ci.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - '.github/workflows/app-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Configure git identity
        run: |
          git config --global user.email "ci@shelbi.local"
          git config --global user.name "shelbi CI"

      - name: Build
        run: cargo build --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # One retry guards against residual timing flakiness under CI load
      # (several test binaries hammer the machine at once). A genuinely broken
      # test fails both attempts and still reddens the job; a retried flake is
      # surfaced as a warning so it stays visible rather than silently masked.
      # Safe to drop once the suite has proven stable across many runs.
      - name: Test
        run: |
          for attempt in 1 2; do
            echo "::group::cargo test --workspace (attempt $attempt)"
            if cargo test --workspace; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::cargo test --workspace failed on attempt $attempt"
          done
          echo "::error::cargo test --workspace failed after 2 attempts"
          exit 1
