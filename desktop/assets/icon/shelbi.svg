<!--
  The Shelbi app icon, source of truth. The mark is the brand's pixel "S"
  (the shape of site/app/icon.svg) redrawn on an exact 10x9 grid of 52px
  cells so it stays crisp down to 16px, light on black, on the macOS icon
  grid: a 1024 canvas with an 824 body at (100, 100), corner radius 185.
  Strict monochrome (#000000 and #D5D5D5, the site icon's two colors).
  `desktop/scripts/render-icon.sh` rasterizes it to shelbi-1024.png, which
  `desktop/scripts/bundle.sh` turns into Shelbi.icns.
-->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#000000"/>
  <g fill="#D5D5D5">
    <rect x="460" y="278" width="260" height="52"/>
    <rect x="408" y="330" width="52" height="52"/>
    <rect x="720" y="330" width="52" height="52"/>
    <rect x="356" y="382" width="104" height="52"/>
    <rect x="356" y="486" width="208" height="52"/>
    <rect x="564" y="538" width="52" height="52"/>
    <rect x="564" y="590" width="104" height="52"/>
    <rect x="252" y="642" width="52" height="52"/>
    <rect x="304" y="694" width="312" height="52"/>
  </g>
</svg>
