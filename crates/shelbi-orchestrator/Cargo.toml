[package]
name = "shelbi-orchestrator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Orchestrator pane bootstrap and system prompt for shelbi"

[dependencies]
shelbi-core = { workspace = true }
shelbi-state = { workspace = true }
shelbi-tmux = { workspace = true }
shelbi-ssh = { workspace = true }
shelbi-agent = { workspace = true }
shelbi-proto = { workspace = true }
# The session-process backend (`session_process_backend`) drives detached
# `shelbi __session` processes through the shared client; `shelbi-session`
# supplies the spawn spec, on-disk layout, and liveness lock.
shelbi-client = { workspace = true }
shelbi-session = { workspace = true }
serde = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
signal-hook = "0.3"
chrono = { workspace = true }
chrono-tz = { workspace = true }
globset = "0.4"
tungstenite = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
tempfile = "3"
serde_yaml = { workspace = true }
# `shelbi-session` is a normal dependency (the session backend). The detector
# round-trip test (`detector_snapshot_parity`) also feeds the ready.rs /
# submit.rs screen fixtures through the session emulator and asserts the
# detectors read the rendered snapshot identically to the raw fixture.
# The review-autoload freshness-guard test drives `autoload_review_queue` against
# a `github` board via the injectable fake `gh` runner (behind this feature).
shelbi-state = { workspace = true, features = ["test-support"] }
