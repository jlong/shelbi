name: Widget Works
default_branch: main
default_workflow: app
orchestrator:
  runner: claude
agent_runners:
  claude:
    command: claude
    flags: []
  codex:
    command: codex
    flags: []
  opus:
    command: claude
    flags:
    - --model
    - claude-opus-5-5
github_url: git@github.com:someone/widget.git
workspace_poll_interval_secs: 5
github_reconcile_interval_secs: 900
zen:
  checks:
    local: []
  ci_timeout: 900
  danger_paths:
    override:
    - .github/workflows/**
    - scripts/install.sh
    - '*.yaml'
    - '*.yml'
    - LICENSE
    - package-lock.json
    - Cargo.lock
heartbeat: 3m
git:
  merge_strategy: squash
issue_tracker:
  backend: github
  github:
    repo: someone/widget
runners:
  claude:
    command: claude
    flags: []
  codex:
    command: codex
    flags: []
agents:
  developer:
    runner: claude
  review:
    runner: claude
  technical-writer:
    runner: codex
