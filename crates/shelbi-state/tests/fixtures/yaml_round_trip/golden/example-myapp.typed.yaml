name: myapp
default_branch: main
orchestrator:
  runner: claude
agent_runners:
  claude:
    command: claude
    flags: []
  codex:
    command: codex
    flags: []
workspace_poll_interval_secs: 5
github_reconcile_interval_secs: 900
zen:
  checks:
    local: []
  ci_timeout: 900
  danger_paths:
    extend: []
heartbeat: 1m
git:
  merge_strategy: squash
repo: git@github.com:me/myapp.git
machines:
- name: hub
  kind: local
  work_dir: ~/Workspaces/myapp
- name: m2
  kind: ssh
  work_dir: ~/work/myapp
  host: m2.local
editor: null
workspaces:
- name: alice
  machine: hub
- name: bob
  machine: m2
- name: carol
  machine: m2
