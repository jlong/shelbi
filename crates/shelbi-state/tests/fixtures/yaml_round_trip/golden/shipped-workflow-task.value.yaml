name: task
description: 'Branch work with a review gate: the default track shipped with every project.'
statuses:
- id: backlog
  owner: user
  agent: orchestrator
- id: todo
  owner: agent
  agent: orchestrator
- id: in-progress
  owner: agent
  agent: developer
- id: review
  owner: user
  agent: review
  tags:
  - review
- id: done
  owner: user
- id: canceled
  owner: user
transitions:
- from: in-progress
  to: review
  actions:
  - push_branch
  - open_pr
- from: review
  to: done
  actions:
  - push_branch
  - merge
- from: in-progress
  to: canceled
  actions:
  - close_pr
  - delete_branch
- from: review
  to: canceled
  actions:
  - close_pr
  - delete_branch
git:
  base_branch: main
  branch: '{{github_user}}/{{id}}'
  merge_strategy: squash
