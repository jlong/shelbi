[package]
name = "shelbi-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Shared application model (navigation, command registry, view models, background refresh) rendered by the TUI and the desktop app"

[dependencies]
# IMPORTANT: this crate is the toolkit-independent app model. It must NOT
# depend on any UI toolkit (ratatui, crossterm, gpui) directly or
# transitively — the TUI and the desktop app are renderers *over* it. The
# `no_ui_deps` integration test enforces this against the resolved tree.
shelbi-core = { workspace = true }
shelbi-state = { workspace = true }
shelbi-palette = { workspace = true }
# The mutation control protocol + its blocking client. Both are UI-toolkit-free
# (serde/std only), so the `no_ui_deps` guard still holds.
shelbi-proto = { workspace = true }
shelbi-client = { workspace = true }
# The askpass dialog and its deadline for the connections a user starts
# (`launch::ssh`). No UI toolkit: osascript runs as a child process.
shelbi-ssh = { workspace = true }
# `rc`: `SearchCorpus` shares its documents in `Arc`s and serializes them
# for the remote window's query service (the feature is already in the tree).
serde = { workspace = true, features = ["rc"] }
# Contact Us's request body and the remembered name and email.
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
# Task descriptions as plain prose (`review::description_text`).
pulldown-cmark = { workspace = true }
thiserror = { workspace = true }

[features]
# Test fixtures other crates' tests build on (`settings::agents::fixture`,
# and `settings::workspaces::fixtures`, the pools both clients' tests build
# from).
test-support = []

[dev-dependencies]
# The activity title-cache tests drive a stubbed `gh` through the store.
shelbi-state = { workspace = true, features = ["test-support"] }
