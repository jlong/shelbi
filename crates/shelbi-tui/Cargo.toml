[package]
name = "shelbi-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "ratatui dashboard for shelbi"

[dependencies]
shelbi-core = { workspace = true }
shelbi-state = { workspace = true }
shelbi-orchestrator = { workspace = true }
shelbi-agent = { workspace = true }
shelbi-palette = { workspace = true }
shelbi-tmux = { workspace = true }
shelbi-ssh = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
unicode-width = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The sidebar's degraded-render test seeds an on-disk board snapshot for a
# remote (github) backend so a cold process serves it while a live read fails;
# this feature exposes `shelbi_state::seed_board_snapshot_for_test`. Dev-only.
shelbi-state = { workspace = true, features = ["test-support"] }
