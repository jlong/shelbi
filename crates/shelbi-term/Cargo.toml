[package]
name = "shelbi-term"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "UI-toolkit-agnostic terminal view for shelbi sessions (emulator, scrollback, selection, search, input encoding)"

[dependencies]
shelbi-proto = { workspace = true }
# The client-side emulator crate chosen in `rt-spike-emulator-replay` (vendored
# fork under `vendor/alacritty_terminal`). Present so this crate and the session
# process can build against it; no product code uses it yet (`rt-term` wires the
# `emulator` seam to it).
alacritty_terminal = { workspace = true }
