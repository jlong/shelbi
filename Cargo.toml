[workspace]
resolver = "2"
members = [
    "crates/shelbi-core",
    "crates/shelbi-state",
    "crates/shelbi-ssh",
    "crates/shelbi-agent",
    "crates/shelbi-orchestrator",
    "crates/shelbi-tui",
    "crates/shelbi-palette",
    "crates/shelbi-app",
    "crates/shelbi-cli",
    "crates/shelbi-proto",
    "crates/shelbi-client",
    "crates/shelbi-term",
    "crates/shelbi-session",
]
default-members = ["crates/shelbi-cli"]
# `vendor/*` holds vendored third-party forks (e.g. `alacritty_terminal`, the
# client-side terminal emulator chosen in the `rt-spike-emulator-replay`
# spike). They are path dependencies of workspace crates but NOT workspace
# members, so `cargo clippy --workspace -- -D warnings` never lints upstream
# code and `cargo test --workspace` never runs their suites.
exclude = ["vendor"]

[workspace.package]
version = "0.9.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/jlong/shelbi"
authors = ["John W. Long <john@johnwlong.com>"]

[workspace.dependencies]
# shared deps, pinned at the workspace root
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
serde_ignored = "0.1"
gray_matter = "0.2"
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
which = "6"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1", features = ["full"] }
strip-ansi-escapes = "0.2"
similar = { version = "2", features = ["text"] }
ratatui = "0.28"
crossterm = "0.28"
nucleo-matcher = "0.3"
inquire = "0.7"
unicode-width = "0.1"
libc = "0.2"
regex = "1"
tungstenite = "0.29"
# Key-input encoder for `shelbi-term` (MIT). Chosen in the remove-tmux plan,
# "Shared client crates": termwiz owns the fiddly key-encoding tables
# (application-cursor keys, modify-other-keys, and the kitty keyboard
# protocol). We use only its `input` encoder, never its terminal backend, so
# default features are off. `shelbi-term` wraps it behind neutral key types.
termwiz = { version = "0.23", default-features = false }
# PTY ownership for the `shelbi __session` process. Chosen in the remove-tmux
# plan (covers ConPTY on Windows behind the same API); the Phase 0 runtime
# spike proved controlling-terminal, group-kill, and no-descriptor-leak
# behavior against this exact version.
portable-pty = "0.9"

# Client-side terminal emulator, vendored under `vendor/` (Apache-2.0). Chosen
# in the `rt-spike-emulator-replay` Phase 0 spike as a fork because attach
# replay needs full access to state the upstream crate keeps private. A
# dependency only for now; `shelbi-term` / `rt-term` wire it to real rendering.
alacritty_terminal = { path = "vendor/alacritty_terminal" }

# internal crates
shelbi-core = { path = "crates/shelbi-core" }
shelbi-state = { path = "crates/shelbi-state" }
shelbi-ssh = { path = "crates/shelbi-ssh" }
shelbi-agent = { path = "crates/shelbi-agent" }
shelbi-orchestrator = { path = "crates/shelbi-orchestrator" }
shelbi-tui = { path = "crates/shelbi-tui" }
shelbi-palette = { path = "crates/shelbi-palette" }
shelbi-app = { path = "crates/shelbi-app" }
shelbi-proto = { path = "crates/shelbi-proto" }
shelbi-client = { path = "crates/shelbi-client" }
shelbi-term = { path = "crates/shelbi-term" }
shelbi-session = { path = "crates/shelbi-session" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Dependencies don't need debug info — we never step into them — and their
# debug symbols are the bulk of a debug `target/`, which is what fills the hub
# disk over a week of Zen builds. This `"*"` override drops debug info for
# non-workspace packages only, shrinking the baseline build substantially;
# our own workspace crates keep the default `[profile.dev]` debug info for
# stepping and backtraces.
[profile.dev.package."*"]
debug = false
