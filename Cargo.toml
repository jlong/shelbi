[workspace]
resolver = "2"
members = [
    "crates/shelbi-core",
    "crates/shelbi-state",
    "crates/shelbi-ssh",
    "crates/shelbi-agent",
    "crates/shelbi-orchestrator",
    "crates/shelbi-tui",
    "crates/shelbi-palette",
    "crates/shelbi-app",
    "crates/shelbi-cli",
    "crates/shelbi-proto",
    "crates/shelbi-client",
    "crates/shelbi-term",
    "crates/shelbi-session",
]
default-members = ["crates/shelbi-cli"]
# `vendor/*` holds vendored third-party forks (e.g. `alacritty_terminal`, the
# client-side terminal emulator chosen in the `rt-spike-emulator-replay`
# spike). They are path dependencies of workspace crates but NOT workspace
# members, so `cargo clippy --workspace -- -D warnings` never lints upstream
# code and `cargo test --workspace` never runs their suites.
#
# `desktop` is the gpui desktop app, its OWN Cargo workspace (own Cargo.lock
# and rust-toolchain.toml): gpui's dependency tree must never move this
# lockfile or this workspace's Rust floor. See desktop/README.md.
exclude = ["vendor", "desktop"]

[workspace.package]
version = "0.14.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/jlong/shelbi"
authors = ["John W. Long <john@johnwlong.com>"]

[workspace.dependencies]
# shared deps, pinned at the workspace root
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
# The YAML organization's maintained fork of serde_yaml (unmaintained since 0.9.34).
# `crates/shelbi-state/tests/yaml_round_trip.rs` pins what it reads and writes.
yaml_serde = "0.10"
serde_json = "1"
serde_ignored = "0.1"
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
# No `tracing-log` bridge (nothing logs through `log` that we read) and no
# `smallvec`: only the formatter, its colors and `EnvFilter` (`SHELBI_LOG`).
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "ansi", "env-filter"] }
similar = { version = "2", features = ["text"] }
# Syntax highlighting for `shelbi_app::diff` (MIT). Line-at-a-time, so it reads
# hunks; pure Rust with the `fancy-regex` engine (no C dependency on either
# workspace). Only the parser is used: no themes, no HTML. two-face adds bat's
# grammar bundle (TypeScript, TOML, Swift, Zig, ...), which syntect's own lacks.
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "underline-color", "layout-cache"] }
crossterm = "0.29"
nucleo-matcher = "0.3"
inquire = { version = "0.9", default-features = false, features = ["crossterm"] }
unicode-width = "0.2"
libc = "0.2"
regex = "1"
tungstenite = "0.29"
# PTY ownership for the `shelbi __session` process. Chosen in the remove-tmux
# plan (covers ConPTY on Windows behind the same API); the Phase 0 runtime
# spike proved controlling-terminal, group-kill, and no-descriptor-leak
# behavior against this exact version.
portable-pty = "0.9"
# CommonMark/GFM parser for `shelbi_app::review::description_text`, the plain
# prose preview of a task body. Only the event stream is used: default
# features (the `html` renderer and the CLI's `getopts`) are off.
pulldown-cmark = { version = "0.13", default-features = false }

# Client-side terminal emulator, vendored under `vendor/` (Apache-2.0). Chosen
# in the `rt-spike-emulator-replay` Phase 0 spike as a fork because attach
# replay needs full access to state the upstream crate keeps private. A
# dependency only for now; `shelbi-term` / `rt-term` wire it to real rendering.
alacritty_terminal = { path = "vendor/alacritty_terminal" }

# internal crates
shelbi-core = { path = "crates/shelbi-core" }
shelbi-state = { path = "crates/shelbi-state" }
shelbi-ssh = { path = "crates/shelbi-ssh" }
shelbi-agent = { path = "crates/shelbi-agent" }
shelbi-orchestrator = { path = "crates/shelbi-orchestrator" }
shelbi-tui = { path = "crates/shelbi-tui" }
shelbi-palette = { path = "crates/shelbi-palette" }
shelbi-app = { path = "crates/shelbi-app" }
shelbi-proto = { path = "crates/shelbi-proto" }
shelbi-client = { path = "crates/shelbi-client" }
shelbi-term = { path = "crates/shelbi-term" }
shelbi-session = { path = "crates/shelbi-session" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Dependencies don't need debug info — we never step into them — and their
# debug symbols are the bulk of a debug `target/`, which is what fills the hub
# disk over a week of Zen builds. This `"*"` override drops debug info for
# non-workspace packages only, shrinking the baseline build substantially;
# our own workspace crates keep the default `[profile.dev]` debug info for
# stepping and backtraces.
[profile.dev.package."*"]
debug = false
