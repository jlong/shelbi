# rt-spike-agents — throwaway Phase 0 prototype.
#
# Standalone crate: `spikes` is in the repo-root Cargo.toml `exclude`, so this
# never touches `cargo build --workspace` / clippy / test. Build it with:
#
#   cargo build --manifest-path spikes/remove-tmux/agents/Cargo.toml
#
# Deleted wholesale at cutover (`rt-cutover-delete`).
# Standalone root: the worktree physically nests inside the main checkout, so
# without this cargo walks up and adopts an ancestor workspace. An empty
# `[workspace]` table makes this crate its own root and keeps it out of every
# workspace (matching the repo-root `exclude = ["spikes"]`).
[workspace]

[package]
name = "rt-spike-agents"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "rt-spike-agents"
path = "src/main.rs"

[dependencies]
# PTY ownership. portable-pty is the plan's choice (covers ConPTY on Windows),
# so the spike proves the exact crate the production session process will use.
portable-pty = "0.9"
# A render-side emulator just good enough to prove a ratatui widget can paint a
# PTY. This is NOT the emulator-crate decision (that is rt-spike-emulator-replay,
# alacritty_terminal vs a vt100-family crate); vt100 is picked here only because
# it is the smallest thing that gives a grid + mode flags to render.
vt100 = "0.16"
crossterm = "0.28"
ratatui = "0.28"
anyhow = "1"
