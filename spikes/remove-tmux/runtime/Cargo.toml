# Standalone workspace root: the spike tree sits inside a git worktree nested
# under the main checkout, so without this cargo walks up and adopts the outer
# workspace. The empty table makes this manifest its own root, which is what
# "excluded from the cargo workspace" has to mean here.
[workspace]

[package]
name = "rt-spike-runtime"
version = "0.0.0"
edition = "2021"
publish = false

# Phase 0 spike for "Removing tmux". NOT part of the cargo workspace
# (the repo root Cargo.toml lists `spikes` under `exclude`), so this builds
# standalone and never affects `cargo build/test/clippy --workspace`:
#
#   cargo run  --manifest-path spikes/remove-tmux/runtime/Cargo.toml -- <cmd>
#   cargo test --manifest-path spikes/remove-tmux/runtime/Cargo.toml
#
# Throwaway. Findings live in docs/removing-tmux/phase0/runtime.md. This whole
# tree is deleted at cutover (rt-cutover-delete).

[[bin]]
name = "rt-runtime"
path = "src/main.rs"

[dependencies]
portable-pty = "0.9"
libc = "0.2"
