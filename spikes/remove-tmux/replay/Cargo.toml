# Empty [workspace] table: this spike is its own standalone cargo workspace so
# it never attaches to a shelbi workspace. `spikes` is excluded from the repo
# root manifest, but inside a git worktree (`.shelbi/wt/<ws>/spikes/...`) the
# spike nests under the MAIN checkout, whose exclude does not reach it; cargo
# then walks up and claims it. This line stops that walk.
[workspace]

[package]
name = "rt-spike-replay"
version = "0.0.0"
edition = "2021"
publish = false

# Throwaway Phase 0 spike. NOT part of the shelbi cargo workspace (the repo
# root Cargo.toml lists `spikes` under `exclude`). Build standalone:
#   cargo test --manifest-path spikes/remove-tmux/replay/Cargo.toml
#   cargo run  --manifest-path spikes/remove-tmux/replay/Cargo.toml --bin capture -- <prog>
[dependencies]
# Primary candidate and the chosen crate: the Alacritty state machine, via the
# SAME vendored fork the workspace uses (read-only replay accessors live there).
alacritty_terminal = { path = "../../../vendor/alacritty_terminal" }
# Comparison candidate: vt100-family. Serializes its visible screen out of the
# box, but has no kitty keyboard protocol and no dual-buffer serialization.
vt100 = "0.16"
# Real PTY capture of less/nvim/top so the replay cases run against genuine
# escape-sequence streams, recorded once into tests/fixtures/.
portable-pty = "0.8"

[lib]
path = "src/lib.rs"

# Capture tool used to record real-program fixtures (and re-runnable by a
# reviewer). Not needed by the tests, which read the committed fixtures.
[[bin]]
name = "capture"
path = "src/bin/capture.rs"
